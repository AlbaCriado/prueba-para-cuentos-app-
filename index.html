<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuentos en orden</title>
<style>
:root{
  --bg:#F2F5EF; --card:#FBFCF9; --ink:#2F3B34; --muted:#5F6F64;
  --sage:#8FAE9B; --sage-d:#4F7A63; --sky:#DDE8EC; --sand:#EFE6D2; --ochre:#E9D9AE; --line:#D3DBD0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:Verdana,"Trebuchet MS",Tahoma,"DejaVu Sans",sans-serif;
  font-size:18px;line-height:1.8;letter-spacing:.03em;word-spacing:.08em;text-align:left;
}
main{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.9rem;margin:0 0 6px;font-weight:700;line-height:1.3}
h2{font-size:1.45rem;margin:0 0 14px;line-height:1.3}
p.lead{color:var(--muted);margin:0 0 26px}
.screen{display:none}.screen.on{display:block}

/* Portadas */
.covers{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}
.cover{position:relative;display:flex;flex-direction:column;width:100%;padding:0;text-align:center;font:inherit;letter-spacing:inherit;word-spacing:inherit;color:var(--ink);cursor:pointer;overflow:hidden;border-radius:6px 18px 18px 6px;border:0;border-left:12px solid var(--spine);background:var(--c)}
.cover:hover,.cover:focus-visible{outline:4px solid var(--sage-d);outline-offset:3px}
.cover svg.art{display:block;width:100%;height:auto}
.cover .tt{padding:10px 12px 16px;font-weight:700;font-size:1.02rem;line-height:1.4}
.cover .tt small{display:block;font-weight:400;font-size:.8rem;color:var(--muted);margin-top:2px}
.cover .seal{position:absolute;top:10px;right:10px;width:34px;height:34px}
.cover.empty{cursor:default;background:transparent;border:3px dashed var(--line);border-radius:18px;justify-content:center;align-items:center;min-height:230px;color:var(--muted);font-size:.9rem;padding:16px}
.cover.empty:hover{outline:none}
.cover .stars{display:flex;justify-content:center;gap:2px;margin-top:4px}
.cover .stars svg{width:18px;height:18px}

.story{background:var(--card);border-radius:24px;padding:24px;border:3px solid var(--line);font-size:1.2rem;line-height:2;max-width:62ch}
.story p{margin:0 0 1em}.story p:last-child{margin:0}

.btn{font:inherit;letter-spacing:inherit;word-spacing:inherit;font-weight:700;border:0;border-radius:999px;padding:14px 28px;cursor:pointer;background:var(--sage-d);color:#fff}
.btn:hover{background:#3F6450}
.btn.soft{background:var(--sky);color:var(--ink)}.btn.soft:hover{background:#cbdbe1}
.btn[hidden]{display:none}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.back{background:none;border:0;font:inherit;letter-spacing:inherit;word-spacing:inherit;font-size:.9rem;color:var(--muted);cursor:pointer;padding:6px 0;margin-bottom:10px}
.hint{color:var(--muted);margin:0 0 16px;font-size:.95rem;line-height:1.6}

ol#list{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:n}
#list li{counter-increment:n;display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 12px;user-select:none;-webkit-user-select:none}
#list li::before{content:counter(n);flex:none;width:38px;height:38px;border-radius:50%;background:var(--sage-d);color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:0}
#list li.drag{border-color:var(--sage-d);background:var(--sky)}
#list li.ok{background:#E1EDE4;border-color:var(--sage)}
#list li.no{background:#F5ECD3;border-color:var(--ochre)}
.grip{flex:none;touch-action:none;cursor:grab;width:30px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--sage-d)}
.grip:active{cursor:grabbing}
.grip svg{width:16px;height:24px}
.txt{flex:1;font-size:1rem;line-height:1.6}

.result{margin-top:22px;background:var(--sand);border-radius:20px;padding:20px 22px;text-align:center;display:none}
.result.on{display:block}
.result .stars{display:flex;justify-content:center;gap:8px}
.result .stars svg{width:40px;height:40px}
.result p{margin:8px 0 0}
:focus-visible{outline:4px solid var(--sage-d);outline-offset:2px}
</style>
</head>
<body>
<main>
  <section id="home" class="screen on">
    <h1>Cuentos en orden</h1>
    <p class="lead">Elige un cuento, léelo con calma y después ponlo en orden.</p>
    <div class="covers" id="covers"></div>
    <div class="bar"><button class="btn soft" id="toColl"></button></div>
  </section>

  <section id="coll" class="screen">
    <button class="back" data-go="home">‹ Volver a los cuentos</button>
    <h2>Mi colección</h2>
    <p class="lead" id="collInfo"></p>
    <div class="covers" id="collCovers"></div>
  </section>

  <section id="read" class="screen">
    <button class="back" data-go="home">‹ Volver a los cuentos</button>
    <h2 id="rtitle"></h2>
    <div class="story" id="rtext"></div>
    <div class="bar"><button class="btn" id="toGame">Ya lo he leído</button></div>
  </section>

  <section id="game" class="screen">
    <button class="back" id="backRead">‹ Volver a leer el cuento</button>
    <h2 id="gtitle"></h2>
    <p class="hint">Arrastra las frases para ponerlas en orden. Los números cambian solos.</p>
    <ol id="list"></ol>
    <div class="bar"><button class="btn" id="check">Comprobar</button></div>
    <div class="result" id="result" aria-live="polite">
      <div class="stars" id="stars"></div>
      <p id="msg"></p>
      <div class="bar" style="justify-content:center">
        <button class="btn" id="goColl" hidden>Ver mi colección</button>
        <button class="btn soft" id="again">Intentarlo otra vez</button>
        <button class="btn soft" data-go="home">Elegir otro cuento</button>
      </div>
    </div>
  </section>
</main>

<script>
/* Ilustraciones de portada: colores planos, sin degradados */
const SKY=(c)=>`<rect width="160" height="150" fill="${c}"/>`;
const ART={
 cap:c=>`<svg class="art" viewBox="0 0 160 150" aria-hidden="true">${SKY(c)}
  <circle cx="126" cy="32" r="14" fill="#E9D9AE"/>
  <circle cx="30" cy="172" r="72" fill="#8FAE9B"/><circle cx="135" cy="178" r="66" fill="#6F9580"/>
  <rect x="24" y="66" width="6" height="30" fill="#6B5A45"/><polygon points="27,28 44,76 10,76" fill="#4F7A63"/><polygon points="27,48 48,96 6,96" fill="#4F7A63"/>
  <path d="M82 62 L104 130 H60 Z" fill="#B8665A"/><circle cx="82" cy="76" r="10" fill="#F3E3D3"/><path d="M71 76 A11 11 0 0 1 93 76 L93 70 A11 11 0 0 0 71 70 Z" fill="#B8665A"/>
  <rect x="106" y="112" width="16" height="11" fill="#C9A66B"/></svg>`,
 bla:c=>`<svg class="art" viewBox="0 0 160 150" aria-hidden="true">${SKY(c)}
  <circle cx="30" cy="30" r="12" fill="#F2F5EF"/>
  <circle cx="35" cy="175" r="70" fill="#8FAE9B"/><circle cx="130" cy="178" r="66" fill="#6F9580"/>
  <circle cx="80" cy="88" r="36" fill="#A9594F"/><circle cx="66" cy="76" r="7" fill="#BE7469"/>
  <rect x="78" y="40" width="5" height="16" fill="#6B5A45"/><ellipse cx="97" cy="46" rx="14" ry="6" fill="#5E8570"/></svg>`,
 cer:c=>`<svg class="art" viewBox="0 0 160 150" aria-hidden="true">${SKY(c)}
  <circle cx="132" cy="28" r="13" fill="#E9D9AE"/>
  <rect y="112" width="160" height="38" fill="#8FAE9B"/>
  <rect x="10" y="80" width="40" height="34" fill="#E0C77A"/><polygon points="6,82 30,58 54,82" fill="#B89A4A"/><rect x="25" y="96" width="9" height="18" fill="${c}"/>
  <rect x="60" y="80" width="40" height="34" fill="#A98558"/><polygon points="56,82 80,58 104,82" fill="#7A5E3E"/><rect x="75" y="96" width="9" height="18" fill="${c}"/>
  <rect x="110" y="80" width="40" height="34" fill="#B5705F"/><polygon points="106,82 130,58 154,82" fill="#7C4E45"/><rect x="125" y="96" width="9" height="18" fill="${c}"/></svg>`
};
const SEAL='<svg class="seal" viewBox="0 0 34 34" aria-label="Completado"><circle cx="17" cy="17" r="17" fill="#4F7A63"/><path d="M9 17.5 L15 23.5 L25 11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const STAR=(on,cls)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 15,9 22.5,9.5 16.8,14.5 18.6,22 12,18 5.4,22 7.2,14.5 1.5,9.5 9,9" fill="${on?"#C9A94E":"#D3DBD0"}"/></svg>`;

const STORIES=[
 {id:"cap",title:"Caperucita Roja",color:"#EBD6CF",spine:"#B8665A",sub:"Un paseo por el bosque",
  s:["Había una vez una niña a la que todos llamaban Caperucita Roja por su capa de color rojo.",
     "Un día, su madre le pidió que llevara una cesta con comida a su abuelita, que estaba enferma.",
     "Por el camino del bosque, Caperucita se encontró con un lobo que le preguntó adónde iba.",
     "El lobo corrió por un atajo, llegó antes a la casa de la abuelita y se hizo pasar por ella.",
     "Cuando Caperucita llegó, notó que su abuelita tenía los ojos, las orejas y los dientes muy grandes.",
     "Un leñador oyó los gritos, entró en la casa y ayudó a Caperucita y a su abuelita."]},
 {id:"bla",title:"Blancanieves",color:"#D6E4E9",spine:"#5E8570",sub:"Siete enanitos en el bosque",
  s:["Blancanieves era una princesa muy bella que vivía con su madrastra, la reina.",
     "La reina, celosa de su belleza, quiso hacerle daño, y Blancanieves huyó al bosque.",
     "Allí encontró una casita y la acogieron siete enanitos muy trabajadores.",
     "La reina, disfrazada de vieja, le ofreció una manzana envenenada y Blancanieves cayó dormida.",
     "Los enanitos, muy tristes, la cuidaron en una urna de cristal.",
     "Un príncipe la besó, Blancanieves despertó y todos fueron muy felices."]},
 {id:"cer",title:"Los tres cerditos",color:"#EDE3C9",spine:"#A98558",sub:"Paja, madera y ladrillos",
  s:["Tres cerditos decidieron construir cada uno su propia casa.",
     "El primero hizo la suya de paja, el segundo de madera y el tercero de ladrillos.",
     "Un día llegó un lobo hambriento y sopló con fuerza la casa de paja, que se vino abajo.",
     "Después sopló la casa de madera, y los dos cerditos corrieron a refugiarse en la de ladrillos.",
     "El lobo sopló y sopló, pero la casa de ladrillos no se movió.",
     "Cansado, el lobo se marchó, y los tres cerditos vivieron seguros y felices."]}
];
const $=id=>document.getElementById(id);
const list=$("list");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const GRIP='<svg viewBox="0 0 16 24" aria-hidden="true" fill="currentColor"><circle cx="4" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
let cur=null;

/* Colección guardada en el navegador (localStorage) */
const KEY="cuentos-en-orden-coleccion";
function getDone(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function setDone(id){try{const d=getDone();d[id]=Date.now();localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}

function coverHTML(s,done){
  return `<button class="cover" data-id="${s.id}" style="--c:${s.color};--spine:${s.spine}" aria-label="${s.title}${done?" (completado)":""}">
    ${ART[s.id](s.color)}${done?SEAL:""}
    <span class="tt">${s.title}<small>${s.sub}</small></span></button>`;
}
function bindCovers(box){
  box.querySelectorAll(".cover[data-id]").forEach(b=>b.onclick=()=>{
    cur=STORIES.find(s=>s.id===b.dataset.id);
    $("rtitle").textContent=cur.title;
    $("rtext").innerHTML=cur.s.map(t=>`<p>${t}</p>`).join("");
    show("read");
  });
}
function renderHome(){
  const d=getDone(),n=STORIES.filter(s=>d[s.id]).length;
  $("covers").innerHTML=STORIES.map(s=>coverHTML(s,!!d[s.id])).join("");
  bindCovers($("covers"));
  $("toColl").textContent=`Mi colección (${n} de ${STORIES.length})`;
}
function renderColl(){
  const d=getDone(),n=STORIES.filter(s=>d[s.id]).length;
  $("collInfo").textContent=n===0?"Aquí guardarás los cuentos que ordenes sin fallar.":
    n===STORIES.length?"¡Has completado todos los cuentos! Qué gran lector.":`Has completado ${n} de ${STORIES.length} cuentos.`;
  $("collCovers").innerHTML=STORIES.map(s=>d[s.id]?coverHTML(s,true):`<div class="cover empty">Todavía por completar</div>`).join("");
  bindCovers($("collCovers"));
}

function show(id){
  if(id==="home")renderHome();
  if(id==="coll")renderColl();
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));
  window.scrollTo(0,0);
}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
$("toColl").onclick=()=>show("coll");
$("goColl").onclick=()=>show("coll");
$("toGame").onclick=()=>{$("gtitle").textContent=cur.title;buildGame();show("game")};
$("backRead").onclick=()=>show("read");
$("again").onclick=buildGame;

function buildGame(){
  let idx=cur.s.map((_,i)=>i);
  do{idx.sort(()=>Math.random()-.5)}while(idx.every((v,i)=>v===i));
  list.innerHTML=idx.map(i=>`<li data-i="${i}"><span class="grip" aria-hidden="true">${GRIP}</span><span class="txt">${cur.s[i]}</span></li>`).join("");
  $("result").classList.remove("on");
}

/* Reordenar con animación: las demás frases se deslizan y los números se actualizan solos */
function moveAnimated(fn,skip){
  const items=[...list.children];
  const first=new Map(items.map(l=>[l,l.getBoundingClientRect().top]));
  fn();
  list.querySelectorAll(".ok,.no").forEach(l=>l.classList.remove("ok","no"));
  if(reduced)return;
  items.forEach(l=>{
    if(l===skip)return;
    const d=first.get(l)-l.getBoundingClientRect().top;
    if(d)l.animate([{transform:`translateY(${d}px)`},{transform:"none"}],{duration:180,easing:"ease-out"});
  });
}

/* Arrastrar y soltar (ratón y táctil) */
let dragEl=null;
list.addEventListener("pointerdown",e=>{
  const g=e.target.closest(".grip");if(!g)return;
  dragEl=g.parentElement;dragEl.classList.add("drag");
  g.setPointerCapture(e.pointerId);e.preventDefault();
});
list.addEventListener("pointermove",e=>{
  if(!dragEl)return;
  const sibs=[...list.children].filter(l=>l!==dragEl);
  const next=sibs.find(l=>{const r=l.getBoundingClientRect();return e.clientY<r.top+r.height/2})||null;
  if(next!==dragEl.nextElementSibling)moveAnimated(()=>list.insertBefore(dragEl,next),dragEl);
  if(e.clientY<80)window.scrollBy(0,-12);else if(e.clientY>innerHeight-80)window.scrollBy(0,12);
});
const end=()=>{if(dragEl){dragEl.classList.remove("drag");dragEl=null}};
list.addEventListener("pointerup",end);list.addEventListener("pointercancel",end);

/* Calificación amable */
$("check").onclick=()=>{
  const items=[...list.children];
  let ok=0;
  items.forEach((li,pos)=>{
    const good=+li.dataset.i===pos;ok+=good;
    li.classList.toggle("ok",good);li.classList.toggle("no",!good);
  });
  const n=items.length,ratio=ok/n;
  const stars=ratio===1?3:ratio>=.6?2:1;
  $("stars").innerHTML=[1,2,3].map(i=>STAR(i<=stars)).join("");
  $("msg").textContent=
    ratio===1?"¡Fantástico! Has ordenado todo el cuento sin fallar. Ya está en tu colección.":
    ratio>=.6?`¡Muy bien! Has acertado ${ok} de ${n} frases. Las frases en amarillo pueden cambiar de sitio. ¡Prueba otra vez!`:
    `¡Buen intento! Has acertado ${ok} de ${n} frases. Lee el cuento otra vez con calma y vuelve a probar: seguro que te sale mejor.`;
  if(ratio===1)setDone(cur.id);
  $("goColl").hidden=ratio!==1;
  $("again").textContent=ratio===1?"Jugar otra vez":"Intentarlo otra vez";
  $("result").classList.add("on");
  $("result").scrollIntoView({behavior:reduced?"auto":"smooth",block:"nearest"});
};

renderHome();
</script>
</body>
</html>
