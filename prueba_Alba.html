<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuentos en orden</title>
<style>
:root{
  --bg:#F2F5EF; --card:#FBFCF9; --ink:#2F3B34; --muted:#5F6F64;
  --sage:#8FAE9B; --sage-d:#4F7A63; --sky:#DDE8EC; --sand:#EFE6D2; --ochre:#E9D9AE; --line:#D3DBD0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);min-height:100vh;
  /* Tipografías sans-serif recomendadas para dislexia (instaladas en la mayoría de sistemas) */
  font-family:Verdana,"Trebuchet MS",Tahoma,"DejaVu Sans",sans-serif;
  font-size:18px;line-height:1.8;letter-spacing:.03em;word-spacing:.14em;text-align:left;
}
main{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.9rem;margin:0 0 6px;font-weight:700;line-height:1.3}
h2{font-size:1.45rem;margin:0 0 14px;line-height:1.3}
p.lead{color:var(--muted);margin:0 0 28px}
.screen{display:none}.screen.on{display:block}

.books{display:grid;gap:14px}
.book{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px 18px;font:inherit;letter-spacing:inherit;word-spacing:inherit;color:inherit;cursor:pointer}
.book:hover,.book:focus-visible{border-color:var(--sage-d)}
.book .ico{flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center}
.book .ico svg{width:40px;height:40px}
.book b{display:block;font-size:1.1rem;line-height:1.4}
.book .s{display:block;color:var(--muted);font-size:.85rem;line-height:1.4}

.story{background:var(--card);border-radius:24px;padding:24px;border:3px solid var(--line);font-size:1.2rem;line-height:2;max-width:62ch}
.story p{margin:0 0 1em}.story p:last-child{margin:0}

.btn{font:inherit;letter-spacing:inherit;word-spacing:inherit;font-weight:700;border:0;border-radius:999px;padding:14px 28px;cursor:pointer;background:var(--sage-d);color:#fff}
.btn:hover{background:#3F6450}
.btn.soft{background:var(--sky);color:var(--ink)}.btn.soft:hover{background:#cbdbe1}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.back{background:none;border:0;font:inherit;letter-spacing:inherit;word-spacing:inherit;font-size:.9rem;color:var(--muted);cursor:pointer;padding:6px 0;margin-bottom:10px}
.hint{color:var(--muted);margin:0 0 16px;font-size:.95rem;line-height:1.6}

ol#list{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:n}
#list li{counter-increment:n;display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 12px;user-select:none;-webkit-user-select:none}
#list li::before{content:counter(n);order:0;flex:none;width:38px;height:38px;border-radius:50%;background:var(--sage-d);color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:0}
#list li.drag{border-color:var(--sage-d);background:var(--sky)}
#list li.ok{background:#E1EDE4;border-color:var(--sage)}
#list li.no{background:#F5ECD3;border-color:var(--ochre)}
.grip{order:1;flex:none;touch-action:none;cursor:grab;width:30px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--sage-d)}
.grip:active{cursor:grabbing}
.grip svg{width:16px;height:24px}
.txt{order:2;flex:1;font-size:1rem;line-height:1.6}

.result{margin-top:22px;background:var(--sand);border-radius:20px;padding:20px 22px;text-align:center;display:none}
.result.on{display:block}
.stars{display:flex;justify-content:center;gap:8px}
.stars svg{width:40px;height:40px}
.result p{margin:8px 0 0}
:focus-visible{outline:4px solid var(--sage-d);outline-offset:2px}
</style>
</head>
<body>
<main>
  <section id="home" class="screen on">
    <h1>Cuentos en orden</h1>
    <p class="lead">Elige un cuento, léelo con calma y después ponlo en orden.</p>
    <div class="books" id="books"></div>
  </section>

  <section id="read" class="screen">
    <button class="back" data-go="home">‹ Volver a los cuentos</button>
    <h2 id="rtitle"></h2>
    <div class="story" id="rtext"></div>
    <div class="bar"><button class="btn" id="toGame">Ya lo he leído</button></div>
  </section>

  <section id="game" class="screen">
    <button class="back" id="backRead">‹ Volver a leer el cuento</button>
    <h2 id="gtitle"></h2>
    <p class="hint">Arrastra las frases para ponerlas en orden. Los números cambian solos.</p>
    <ol id="list"></ol>
    <div class="bar"><button class="btn" id="check">Comprobar</button></div>
    <div class="result" id="result" aria-live="polite">
      <div class="stars" id="stars"></div>
      <p id="msg"></p>
      <div class="bar" style="justify-content:center">
        <button class="btn soft" id="again">Intentarlo otra vez</button>
        <button class="btn soft" data-go="home">Elegir otro cuento</button>
      </div>
    </div>
  </section>
</main>

<script>
const ICON={
 cap:'<svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 3 L33 33 H3 Z" fill="#B8665A"/><circle cx="18" cy="17" r="6" fill="#F3E3D3"/></svg>',
 bla:'<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="21" r="12" fill="#A9594F"/><rect x="17" y="3" width="3" height="8" fill="#6B5A45"/><ellipse cx="25" cy="7" rx="6" ry="3" fill="#5E8570"/></svg>',
 cer:'<svg viewBox="0 0 36 36" aria-hidden="true"><rect x="6" y="17" width="24" height="16" fill="#C9A66B"/><path d="M2 18 L18 4 L34 18 Z" fill="#8A6F4D"/><rect x="15" y="23" width="6" height="10" fill="#F2F5EF"/></svg>'
};
const STORIES=[
 {id:"cap",title:"Caperucita Roja",color:"#F0DDD8",sub:"Un paseo por el bosque",
  s:["Había una vez una niña a la que todos llamaban Caperucita Roja por su capa de color rojo.",
     "Un día, su madre le pidió que llevara una cesta con comida a su abuelita, que estaba enferma.",
     "Por el camino del bosque, Caperucita se encontró con un lobo que le preguntó adónde iba.",
     "El lobo corrió por un atajo, llegó antes a la casa de la abuelita y se hizo pasar por ella.",
     "Cuando Caperucita llegó, notó que su abuelita tenía los ojos, las orejas y los dientes muy grandes.",
     "Un leñador oyó los gritos, entró en la casa y ayudó a Caperucita y a su abuelita."]},
 {id:"bla",title:"Blancanieves",color:"#DDE8EC",sub:"Siete enanitos en el bosque",
  s:["Blancanieves era una princesa muy bella que vivía con su madrastra, la reina.",
     "La reina, celosa de su belleza, quiso hacerle daño, y Blancanieves huyó al bosque.",
     "Allí encontró una casita y la acogieron siete enanitos muy trabajadores.",
     "La reina, disfrazada de vieja, le ofreció una manzana envenenada y Blancanieves cayó dormida.",
     "Los enanitos, muy tristes, la cuidaron en una urna de cristal.",
     "Un príncipe la besó, Blancanieves despertó y todos fueron muy felices."]},
 {id:"cer",title:"Los tres cerditos",color:"#EFE6D2",sub:"Paja, madera y ladrillos",
  s:["Tres cerditos decidieron construir cada uno su propia casa.",
     "El primero hizo la suya de paja, el segundo de madera y el tercero de ladrillos.",
     "Un día llegó un lobo hambriento y sopló con fuerza la casa de paja, que se vino abajo.",
     "Después sopló la casa de madera, y los dos cerditos corrieron a refugiarse en la de ladrillos.",
     "El lobo sopló y sopló, pero la casa de ladrillos no se movió.",
     "Cansado, el lobo se marchó, y los tres cerditos vivieron seguros y felices."]}
];
const $=id=>document.getElementById(id);
const list=$("list");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const GRIP='<svg viewBox="0 0 16 24" aria-hidden="true" fill="currentColor"><circle cx="4" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
const STAR=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 15,9 22.5,9.5 16.8,14.5 18.6,22 12,18 5.4,22 7.2,14.5 1.5,9.5 9,9" fill="${on?"#C9A94E":"#D3DBD0"}"/></svg>`;
let cur=null;

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0)}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));

$("books").innerHTML=STORIES.map(s=>`<button class="book" data-id="${s.id}"><span class="ico" style="background:${s.color}">${ICON[s.id]}</span><span><b>${s.title}</b><span class="s">${s.sub}</span></span></button>`).join("");
document.querySelectorAll(".book").forEach(b=>b.onclick=()=>{
  cur=STORIES.find(s=>s.id===b.dataset.id);
  $("rtitle").textContent=cur.title;
  $("rtext").innerHTML=cur.s.map(t=>`<p>${t}</p>`).join("");
  show("read");
});
$("toGame").onclick=()=>{$("gtitle").textContent=cur.title;buildGame();show("game")};
$("backRead").onclick=()=>show("read");
$("again").onclick=buildGame;

function buildGame(){
  let idx=cur.s.map((_,i)=>i);
  do{idx.sort(()=>Math.random()-.5)}while(idx.every((v,i)=>v===i));
  list.innerHTML=idx.map(i=>`<li data-i="${i}"><span class="grip" aria-hidden="true">${GRIP}</span><span class="txt">${cur.s[i]}</span></li>`).join("");
  $("result").classList.remove("on");
}

/* Reordenar con animación: las demás frases se deslizan y los números se actualizan solos */
function moveAnimated(fn,skip){
  const items=[...list.children];
  const first=new Map(items.map(l=>[l,l.getBoundingClientRect().top]));
  fn();
  list.querySelectorAll(".ok,.no").forEach(l=>l.classList.remove("ok","no"));
  if(reduced)return;
  items.forEach(l=>{
    if(l===skip)return;
    const d=first.get(l)-l.getBoundingClientRect().top;
    if(d)l.animate([{transform:`translateY(${d}px)`},{transform:"none"}],{duration:180,easing:"ease-out"});
  });
}

/* Arrastrar y soltar (ratón y táctil) */
let dragEl=null;
list.addEventListener("pointerdown",e=>{
  const g=e.target.closest(".grip");if(!g)return;
  dragEl=g.parentElement;dragEl.classList.add("drag");
  g.setPointerCapture(e.pointerId);e.preventDefault();
});
list.addEventListener("pointermove",e=>{
  if(!dragEl)return;
  const sibs=[...list.children].filter(l=>l!==dragEl);
  const next=sibs.find(l=>{const r=l.getBoundingClientRect();return e.clientY<r.top+r.height/2})||null;
  if(next!==dragEl.nextElementSibling)moveAnimated(()=>list.insertBefore(dragEl,next),dragEl);
  if(e.clientY<80)window.scrollBy(0,-12);else if(e.clientY>innerHeight-80)window.scrollBy(0,12);
});
const end=()=>{if(dragEl){dragEl.classList.remove("drag");dragEl=null}};
list.addEventListener("pointerup",end);list.addEventListener("pointercancel",end);

/* Calificación amable */
$("check").onclick=()=>{
  const items=[...list.children];
  let ok=0;
  items.forEach((li,pos)=>{
    const good=+li.dataset.i===pos;ok+=good;
    li.classList.toggle("ok",good);li.classList.toggle("no",!good);
  });
  const n=items.length,ratio=ok/n;
  const stars=ratio===1?3:ratio>=.6?2:1;
  $("stars").innerHTML=[1,2,3].map(i=>STAR(i<=stars)).join("");
  $("msg").textContent=
    ratio===1?"¡Fantástico! Has ordenado todo el cuento sin fallar.":
    ratio>=.6?`¡Muy bien! Has acertado ${ok} de ${n} frases. Las frases en amarillo pueden cambiar de sitio. ¡Prueba otra vez!`:
    `¡Buen intento! Has acertado ${ok} de ${n} frases. Lee el cuento otra vez con calma y vuelve a probar: seguro que te sale mejor.`;
  $("again").textContent=ratio===1?"Jugar otra vez":"Intentarlo otra vez";
  $("result").classList.add("on");
  $("result").scrollIntoView({behavior:reduced?"auto":"smooth",block:"nearest"});
};
</script>
</body>
</html>
